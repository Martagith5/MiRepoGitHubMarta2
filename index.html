<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Préstamos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Cuotas</h1>
        <div class="input-group">
            <label>Monto del Préstamo (€)</label>
            <input type="number" id="monto" placeholder="Ej: 200000" oninput="calcular()">
        </div>
        <div class="input-group">
            <label>Interés Anual (%)</label>
            <input type="number" id="interes" placeholder="Ej: 3.5" step="0.1" oninput="calcular()">
        </div>
        <div class="input-group">
            <label>Plazo (Años)</label>
            <input type="number" id="plazo" placeholder="Ej: 20" oninput="calcular()">
        </div>

        <div class="result-box">
            <h3>Cuota Mensual Estimada</h3>
            <p id="resultado">0.00€</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
